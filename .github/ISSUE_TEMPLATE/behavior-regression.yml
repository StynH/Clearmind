name: Behavior regression
description: Report a reproducible ClearMind workflow failure.
title: "Behavior: "
body:
  - type: textarea
    id: context
    attributes:
      label: Host and task context
      description: Include host/model, ClearMind version, available capabilities, and the relevant request. Remove private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and evidence
      description: Include a minimal reproduction and relevant sanitized transcript, diff, or tool result.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification limits
      description: State whether the skill was actually loaded and what could not be checked.
